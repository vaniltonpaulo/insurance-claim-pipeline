[project]
name = "insurance-cliam-dbt-project"
version = "0.1.0"
description = "End-to-end insurance claims data pipeline using dbt and Databricks"
readme = "README.md"

authors = [
    { name = "vaniltonpaulo", email = "V.Paulo@campus.lmu.de" }
]

requires-python = ">=3.13,<3.14"

dependencies = [
    "dbt-core>=1.12.6,<2.0.0",
    "dbt-databricks>=1.13.0,<2.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "sqlfluff>=4.5.0",
    "yamllint>=1.38.0",
]
