# dbt connection profiles for the insurance claims pipeline.
# DEV: local development | CI: automated testing via GitHub Actions.

insurance_claims_pipeline:
  target: dev  # Default environment when --target is not specified

  outputs:
    # DEVELOPMENT
    # Builds models in insurance.dbt_dev without affecting CI tables.
    dev:
      type: databricks
      catalog: insurance
      schema: dbt_dev
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      threads: 4  # Maximum concurrent dbt model executions

    # CONTINUOUS INTEGRATION (CI)
    # GitHub Actions uses this target to build and test code.
    # Each workflow run gets its own schema to avoid conflicts.
    ci:
      type: databricks
      catalog: insurance
      schema: ci_{{ env_var('GITHUB_RUN_ID', 'local') }}
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      threads: 1  # Run one dbt operation at a time